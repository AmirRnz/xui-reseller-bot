name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bot_user
          POSTGRES_PASSWORD: bot_password
          POSTGRES_DB: bot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Check formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not formatted properly:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: Run unit and isolated DB tests with race detection
        env:
          TEST_DATABASE_URL: postgres://bot_user:bot_password@localhost:5432/bot_test?sslmode=disable
          DATABASE_URL: postgres://bot_user:bot_password@localhost:5432/bot_test?sslmode=disable
        run: go test -v -race -count=1 -p 1 ./...

      - name: Build application binary
        run: go build -v ./cmd/bot
